<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Apple Music Style Player</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #000; color: white; margin: 0; overflow: hidden; 
        }

        /* The Blurred Ambient Background */
        .background-blur {
            position: fixed; top: -10%; left: -10%; width: 120%; height: 120%;
            object-fit: cover; filter: blur(90px) brightness(0.4) saturate(1.5);
            z-index: -1; transition: opacity 1s ease-in-out;
        }

        /* File Selection Screen */
        #file-section {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; z-index: 10;
        }
        #upload-btn {
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(20px);
            color: white; border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 15px 30px; border-radius: 50px; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: background 0.3s;
        }
        #upload-btn:hover { background: rgba(255, 255, 255, 0.3); }

        /* Split Screen Layout */
        #app-container { display: none; width: 100vw; height: 100vh; }

        /* Left Side: Album Art & Controls */
        .left-pane {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 40px;
        }
        .album-art {
            width: 400px; height: 400px; border-radius: 12px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5); margin-bottom: 30px;
            object-fit: cover;
        }
        .track-info { width: 400px; margin-bottom: 30px; text-align: left; }
        .track-info h2 { margin: 0; font-size: 28px; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-info p { margin: 5px 0 0; font-size: 20px; color: rgba(255,255,255,0.7); font-weight: 500; }

        .controls { display: flex; gap: 25px; width: 400px; justify-content: center; align-items: center; }
        .controls button {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px);
            border: none; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; cursor: pointer; transition: transform 0.2s, background 0.2s;
        }
        .controls button:hover { background: rgba(255, 255, 255, 0.25); transform: scale(1.05); }
        .btn-small { width: 50px; height: 50px; }
        .btn-large { width: 70px; height: 70px; }

        /* Right Side: Lyrics */
        .right-pane {
            flex: 1.2; padding: 0 80px; overflow-y: scroll; scroll-behavior: smooth;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            scrollbar-width: none;
        }
        .right-pane::-webkit-scrollbar { display: none; }

        .lyric-line {
            font-size: 38px; font-weight: 800; line-height: 1.4; color: rgba(255,255,255,0.3);
            margin-bottom: 25px; transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            transform-origin: left center; cursor: pointer;
        }
        .lyric-line.active { color: white; transform: scale(1.05); text-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .lyric-line:hover { color: rgba(255,255,255,0.8); }
        .lyric-status { text-align: center; font-size: 24px; color: rgba(255,255,255,0.5); margin-top: 40vh; }
    </style>
</head>
<body>

    <img id="bg-blur" class="background-blur" src="" alt="">

    <!-- Initial File Selection -->
    <div id="file-section">
        <h2 style="font-size: 32px; font-weight: 800; margin-bottom: 10px;">Local Audio Player</h2>
        <p style="color: rgba(255,255,255,0.6); margin-bottom: 30px;">Select MP3 or FLAC files to play. No API keys required.</p>
        <input type="file" id="audio-upload" accept="audio/*" multiple style="display: none;">
        <button id="upload-btn" onclick="document.getElementById('audio-upload').click()">Choose File(s)</button>
    </div>

    <!-- Main Player Interface -->
    <div id="app-container">
        <div class="left-pane">
            <img id="album-art" class="album-art" src="" alt="Album Art">
            <div class="track-info">
                <h2 id="track-name">Loading...</h2>
                <p id="artist-name"></p>
            </div>
            
            <div class="controls">
                <button id="prev-btn" class="btn-small">
                    <svg viewBox="0 0 24 24" fill="white" width="24" height="24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button id="togglePlay-btn" class="btn-large">
                    <svg viewBox="0 0 24 24" fill="white" width="36" height="36"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button id="next-btn" class="btn-small">
                    <svg viewBox="0 0 24 24" fill="white" width="24" height="24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>

            <!-- Add to Queue Button -->
            <input type="file" id="add-audio-upload" accept="audio/*" multiple style="display: none;">
            <button id="add-songs-btn" style="margin-top: 30px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 10px 25px; border-radius: 50px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s;">
                + Add Songs to Queue
            </button>
        </div>
        
        <div class="right-pane" id="lyrics-container"></div>
    </div>

<!-- Library to read ID3 tags (metadata like Cover Art and Artist) directly from the MP3 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

<script>
    let audioPlayer = new Audio();
    let currentLyrics = [];
    let playlist = [];
    let currentTrackIndex = 0;
    
    // Default placeholder artwork
    const defaultArt = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="%23222"/><text x="50%" y="50%" fill="%23777" font-family="sans-serif" font-size="24" text-anchor="middle" dominant-baseline="middle">No Cover Art</text></svg>';

    // --- 1. INITIAL FILE UPLOAD ---
    document.getElementById('audio-upload').addEventListener('change', function(event) {
        playlist = Array.from(event.target.files);
        if (playlist.length === 0) return;

        document.getElementById('file-section').style.display = 'none';
        document.getElementById('app-container').style.display = 'flex';
        
        loadTrack(0);
    });

    // --- 2. ADD MORE SONGS TO QUEUE ---
    document.getElementById('add-songs-btn').addEventListener('click', () => {
        document.getElementById('add-audio-upload').click();
    });

    document.getElementById('add-audio-upload').addEventListener('change', function(event) {
        const newFiles = Array.from(event.target.files);
        if (newFiles.length === 0) return;
        
        // Append the new songs to the existing playlist array
        playlist = playlist.concat(newFiles);
        
        // Visual feedback on the button
        const btn = document.getElementById('add-songs-btn');
        const originalText = btn.innerText;
        btn.innerText = `Added ${newFiles.length} track(s)!`;
        btn.style.background = "rgba(40, 200, 80, 0.4)"; // flash green
        btn.style.borderColor = "rgba(40, 200, 80, 0.8)";
        
        setTimeout(() => {
            btn.innerText = originalText;
            btn.style.background = "rgba(255,255,255,0.1)";
            btn.style.borderColor = "rgba(255,255,255,0.3)";
        }, 2000);
    });

    // --- 3. LOAD AND PLAY TRACK ---
    function loadTrack(index) {
        const file = playlist[index];
        if (!file) return;
        
        if (audioPlayer.src) URL.revokeObjectURL(audioPlayer.src);
        audioPlayer.src = URL.createObjectURL(file);
        
        // Reset UI
        document.getElementById('track-name').innerText = file.name.replace(/\.[^/.]+$/, "");
        document.getElementById('artist-name').innerText = 'Local File';
        document.getElementById('album-art').src = defaultArt;
        document.getElementById('bg-blur').src = defaultArt;
        document.getElementById('lyrics-container').innerHTML = '<div class="lyric-status">Searching for lyrics...</div>';
        currentLyrics = [];
        
        // Read Metadata (Cover Art, Title, Artist)
        window.jsmediatags.read(file, {
            onSuccess: function(tag) {
                const tags = tag.tags;
                const title = tags.title || file.name.replace(/\.[^/.]+$/, "");
                const artist = tags.artist || "Unknown Artist";
                
                document.getElementById('track-name').innerText = title;
                document.getElementById('artist-name').innerText = artist;

                if (tags.picture) {
                    const byteArray = new Uint8Array(tags.picture.data);
                    const blob = new Blob([byteArray], { type: tags.picture.format });
                    const coverUrl = URL.createObjectURL(blob);
                    document.getElementById('album-art').src = coverUrl;
                    document.getElementById('bg-blur').src = coverUrl;
                }

                audioPlayer.onloadedmetadata = async () => {
                    const duration = Math.floor(audioPlayer.duration);
                    const lyricsData = await fetchLyrics(title, artist, tags.album || "", duration);
                    
                    if (lyricsData && lyricsData.syncedLyrics) {
                        currentLyrics = parseLrc(lyricsData.syncedLyrics);
                        renderLyrics(currentLyrics);
                    } else if (lyricsData && lyricsData.plainLyrics) {
                        document.getElementById('lyrics-container').innerHTML = `<div class="lyric-status" style="margin-top: 10vh; text-align: left;">${lyricsData.plainLyrics.replace(/\n/g, '<br><br>')}</div>`;
                    } else {
                        document.getElementById('lyrics-container').innerHTML = '<div class="lyric-status">No lyrics available online for this local file.</div>';
                    }
                    audioPlayer.play();
                };
            },
            onError: function() { 
                // Play anyway if no ID3 tags are found (common for WAV or plain files)
                audioPlayer.play(); 
            } 
        });
    }

    // --- 4. LYRICS API (LRCLIB) ---
    async function fetchLyrics(track, artist, album, durationSec) {
        let url = `https://lrclib.net/api/get?track_name=${encodeURIComponent(track)}&artist_name=${encodeURIComponent(artist)}`;
        if (album) url += `&album_name=${encodeURIComponent(album)}`;
        if (durationSec) url += `&duration=${durationSec}`;
        
        try {
            const response = await fetch(url);
            if (!response.ok) {
                const searchRes = await fetch(`https://lrclib.net/api/search?track_name=${encodeURIComponent(track)}&artist_name=${encodeURIComponent(artist)}`);
                const searchData = await searchRes.json();
                return searchData.length > 0 ? searchData[0] : null;
            }
            return await response.json();
        } catch (error) { return null; }
    }

    function parseLrc(lrcString) {
        const lines = lrcString.split('\n');
        const parsed = [];
        const regex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
        
        for (const line of lines) {
            const match = regex.exec(line);
            if (match && match[4].trim()) {
                const min = parseInt(match[1]);
                const sec = parseInt(match[2]);
                const ms = parseInt(match[3].padEnd(3, '0'));
                parsed.push({ time: (min * 60 * 1000) + (sec * 1000) + ms, text: match[4].trim() });
            }
        }
        return parsed;
    }

    function renderLyrics(lyricsArray) {
        const container = document.getElementById('lyrics-container');
        container.innerHTML = '<div style="height: 40vh;"></div>'; // Top spacer

        lyricsArray.forEach((line, index) => {
            const div = document.createElement('div');
            div.className = 'lyric-line';
            div.innerText = line.text;
            div.onclick = () => { audioPlayer.currentTime = line.time / 1000; };
            container.appendChild(div);
        });
        container.innerHTML += '<div style="height: 40vh;"></div>'; // Bottom spacer
    }

    // --- 5. CONTINUOUS LYRIC SYNC LOOP ---
    setInterval(() => {
        if (audioPlayer.paused || currentLyrics.length === 0) return;
        const pos = audioPlayer.currentTime * 1000;
        let activeIdx = -1;
        
        for (let i = 0; i < currentLyrics.length; i++) {
            if (pos >= currentLyrics[i].time) activeIdx = i;
            else break;
        }
        
        if (activeIdx !== -1) {
            const lines = document.querySelectorAll('.lyric-line');
            lines.forEach((el, idx) => {
                if (idx === activeIdx) {
                    if (!el.classList.contains('active')) {
                        el.classList.add('active');
                        const container = document.getElementById('lyrics-container');
                        container.scrollTo({
                            top: el.offsetTop - container.offsetTop - (container.clientHeight / 2) + (el.clientHeight / 2),
                            behavior: 'smooth'
                        });
                    }
                } else {
                    el.classList.remove('active');
                }
            });
        }
    }, 100);

    // --- 6. PLAYBACK CONTROLS ---
    audioPlayer.onplay = () => document.getElementById('togglePlay-btn').innerHTML = '<svg viewBox="0 0 24 24" fill="white" width="36" height="36"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
    audioPlayer.onpause = () => document.getElementById('togglePlay-btn').innerHTML = '<svg viewBox="0 0 24 24" fill="white" width="36" height="36"><path d="M8 5v14l11-7z"/></svg>';

    document.getElementById('togglePlay-btn').addEventListener('click', () => audioPlayer.paused ? audioPlayer.play() : audioPlayer.pause());
    
    document.getElementById('next-btn').addEventListener('click', () => {
        if (currentTrackIndex < playlist.length - 1) loadTrack(++currentTrackIndex);
    });
    document.getElementById('prev-btn').addEventListener('click', () => {
        if (audioPlayer.currentTime > 3) audioPlayer.currentTime = 0;
        else if (currentTrackIndex > 0) loadTrack(--currentTrackIndex);
    });
    
    // Auto-play next track when current ends
    audioPlayer.addEventListener('ended', () => {
        if (currentTrackIndex < playlist.length - 1) loadTrack(++currentTrackIndex);
    });
</script>

</body>
</html>
